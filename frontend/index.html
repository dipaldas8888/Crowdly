<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crowdly · Connect &amp; Share</title>
    <meta name="description" content="Crowdly is a modern social media platform to connect with friends, share stories, watch videos, and join community groups." />
    <style>
      /* ── Instant splash shown before React hydrates ── */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #splash-logo {
        width: 80px;
        height: 80px;
        border-radius: 22px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(124, 58, 237, 0.5), 0 0 80px rgba(79, 70, 229, 0.3);
        animation: pulse-glow 2s ease-in-out infinite;
      }
      #splash-logo svg {
        width: 48px;
        height: 48px;
        fill: none;
        stroke: white;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #splash-title {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(90deg, #a78bfa, #60a5fa, #a78bfa);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shimmer 2s linear infinite;
      }
      #splash-dots {
        display: flex;
        gap: 8px;
      }
      #splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7c3aed;
        animation: bounce-dot 1.2s ease-in-out infinite;
      }
      #splash-dots span:nth-child(2) { animation-delay: 0.2s; background: #4f46e5; }
      #splash-dots span:nth-child(3) { animation-delay: 0.4s; background: #60a5fa; }
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 40px rgba(124,58,237,0.5), 0 0 80px rgba(79,70,229,0.3); }
        50% { box-shadow: 0 0 60px rgba(124,58,237,0.8), 0 0 120px rgba(79,70,229,0.5); }
      }
      @keyframes shimmer {
        0% { background-position: 0% center; }
        100% { background-position: 200% center; }
      }
      @keyframes bounce-dot {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
        40% { transform: scale(1.2); opacity: 1; }
      }
      /* Hide splash once React root renders */
      #root:not(:empty) ~ * { display: none; }
    </style>
  </head>
  <body>
    <!-- Instant branded splash – visible before JS parses -->
    <div id="splash">
      <div id="splash-logo">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="3"/>
          <circle cx="5" cy="16" r="2.5"/>
          <circle cx="19" cy="16" r="2.5"/>
          <line x1="12" y1="11" x2="5" y2="13.5"/>
          <line x1="12" y1="11" x2="19" y2="13.5"/>
        </svg>
      </div>
      <div id="splash-title">Crowdly</div>
      <div id="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Remove splash once React mounts -->
    <script>
      (function() {
        var splash = document.getElementById('splash');
        var root = document.getElementById('root');
        var observer = new MutationObserver(function() {
          if (root.children.length > 0) {
            splash.classList.add('hidden');
            setTimeout(function() { splash.remove(); }, 500);
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
        // Safety fallback – remove after 8s regardless
        setTimeout(function() {
          splash.classList.add('hidden');
          setTimeout(function() { if (splash.parentNode) splash.remove(); }, 500);
        }, 8000);
      })();
    </script>
  </body>
</html>
